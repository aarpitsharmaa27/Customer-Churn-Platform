<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Churn Predictor</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>Customer Churn Predictor</h1>

            <p>
                Predict the likelihood of a customer leaving your service.
            </p>
        </div>


        <form id="churnForm">

            <label for="tenure">
                Customer Tenure (months)
            </label>

            <input
                type="number"
                id="tenure"
                placeholder="e.g. 12"
                min="0"
                max="100"
                required
            >


            <label for="monthlyCharges">
                Monthly Service Charges
            </label>

            <input
                type="number"
                id="monthlyCharges"
                placeholder="e.g. 70.50"
                min="0"
                max="1000"
                step="0.01"
                required
            >


            <label for="totalCharges">
                Total Charges
            </label>

            <input
                type="number"
                id="totalCharges"
                placeholder="e.g. 850.34"
                min="0"
                max="100000"
                step="0.01"
                required
            >


            <button
                type="submit"
                id="predictButton"
            >
                Predict Churn
            </button>

        </form>


        <div id="result"></div>

    </div>


    <script src="script.js"></script>

</body>

</html>
